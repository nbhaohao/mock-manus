services:
  postgres:
    image: postgres:latest
    container_name: manus-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manus
    ports:
      - "5432:5432"
    volumes:
      - manus_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manus"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:latest
    container_name: manus-redis
    ports:
      - "6379:6379"
    volumes:
      - manus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  manus_postgres_data:
  manus_redis_data:
